<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>Quant V2 | Paper Trading</title><style>body{margin:0;background:#0b1220;color:#e9eef8;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 70px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:6px 0}small,.muted{color:#94a3b8}.pill{background:#243447;color:#a5f3fc;border-radius:20px;padding:7px 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#162235;border:1px solid #27364d;border-radius:15px;padding:16px;margin-top:13px}.big{font-size:26px;font-weight:750;margin-top:9px}.positive{color:#5ee4ae}.negative{color:#ff8d95}select,button{border:0;border-radius:10px;padding:13px;background:#263c59;color:white;font-size:16px}button{background:#377be6;font-weight:700;width:100%;margin-top:12px}select{width:100%}canvas{width:100%;height:220px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 5px;text-align:left;border-bottom:1px solid #2c3c50}#error{color:#ff9aa0;white-space:pre-wrap} .note{line-height:1.65;color:#a6b6c9}</style></head><body><main><header><div><small>QUANT LAB / V2</small><h1>量化模拟终端</h1></div><span class="pill">仅模拟交易</span></header><div class="grid"><div class="card"><small>初始本金</small><div class="big">A$1,000</div></div><div class="card"><small>回测期末资产</small><div class="big" id="final">—</div></div><div class="card"><small>累计收益率</small><div class="big" id="ret">—</div></div><div class="card"><small>最大回撤</small><div class="big" id="dd">—</div></div></div><div class="card"><label for="symbol">回测标的</label><select id="symbol"><option>SPY</option><option>QQQ</option><option>IWM</option><option>DIA</option></select><button id="run">获取真实行情并回测</button><p id="status" class="muted">等待加载</p><p id="error"></p></div><div class="card"><strong>资产净值曲线（AUD）</strong><canvas id="chart"></canvas></div><div class="card"><strong>策略信号与数据</strong><p id="sig">—</p><p id="meta" class="muted">—</p></div><div class="card"><strong>模拟成交记录</strong><div style="overflow:auto"><table><thead><tr><th>日期</th><th>方向</th><th>股数</th><th>成交价 USD</th></tr></thead><tbody id="orders"></tbody></table></div></div><p class="note">仅用于教育与研究。价格采用未调整日线，分红、拆股、税务和真实经纪商成交限制尚未完整建模；回测结果不可作为实际收益预测。汇率采用查询时的单一 AUD/USD 汇率，非逐日历史汇率。信号基于前一交易日收盘价，下一交易日开盘模拟执行。行情服务为非官方接口，可能限流或中断。</p></main><script>
const $=id=>document.getElementById(id);function draw(points){const c=$('chart'),ctx=c.getContext('2d'),w=c.clientWidth,h=220,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!points.length)return;let v=points.map(p=>p.equityAUD),lo=Math.min(...v)*.995,hi=Math.max(...v)*1.005;if(hi===lo)hi++;ctx.strokeStyle='#33465e';ctx.beginPath();for(let i=0;i<4;i++){let y=15+i*(h-30)/3;ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke();ctx.strokeStyle='#55c9d6';ctx.lineWidth=2;ctx.beginPath();v.forEach((n,i)=>{let x=i/(v.length-1||1)*w,y=15+(hi-n)/(hi-lo)*(h-30);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
async function run(){$('run').disabled=true;$('error').textContent='';$('status').textContent='正在读取行情和计算回测…';try{let r=await fetch('/api/backtest?symbol='+encodeURIComponent($('symbol').value));let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');let b=d.result;$('final').textContent='A$'+b.finalAUD.toLocaleString();$('ret').textContent=b.returnPct+'%';$('ret').className='big '+(b.returnPct>=0?'positive':'negative');$('dd').textContent=b.maxDrawdownPct+'%';$('sig').textContent='最新信号：'+d.signal.action+' / 因子得分 '+d.signal.score+' / 风控暂停 '+(b.paused?'是':'否');$('meta').textContent=`${d.symbol} · ${d.dataStart} 至 ${d.dataEnd} · 汇率 1 AUD = ${b.fxUsed.toFixed(4)} USD · ${b.orders.length} 笔成交`;$('orders').replaceChildren(...b.orders.slice(-30).reverse().map(o=>{let tr=document.createElement('tr');[o.date,o.side,o.shares,o.price.toFixed(2)].forEach(x=>{let td=document.createElement('td');td.textContent=x;tr.append(td)});return tr}));draw(b.curve);$('status').textContent='回测完成 · 历史数据非实时';}catch(e){$('status').textContent='无法完成回测';$('error').textContent=e.message+'。请检查网络或稍后重试；不会自动生成虚假行情。'}finally{$('run').disabled=false}}
$('run').onclick=run;run();</script></body></html>
